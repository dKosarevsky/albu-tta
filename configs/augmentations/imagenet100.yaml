version: 1
description: 100 deterministic single-transform AlbumentationsX TTA candidates for ImageNet.
candidates:
  - id: aug_000
    name: identity
    transform: null
  - id: aug_001
    name: horizontal_flip
    transform: {class_name: HorizontalFlip, params: {p: 1.0}}
  - id: aug_002
    name: vertical_flip
    transform: {class_name: VerticalFlip, params: {p: 1.0}}
  - id: aug_003
    name: transpose
    transform: {class_name: Transpose, params: {p: 1.0}}
  - id: aug_004
    name: rotate90
    transform: {class_name: RandomRotate90, params: {group_element: r90, p: 1.0}}
  - id: aug_005
    name: rotate180
    transform: {class_name: RandomRotate90, params: {group_element: r180, p: 1.0}}
  - id: aug_006
    name: rotate270
    transform: {class_name: RandomRotate90, params: {group_element: r270, p: 1.0}}
  - id: aug_007
    name: rotate_plus_10
    transform:
      class_name: Rotate
      params: {angle_range: [10.0, 10.0], border_mode: 4, fill: 0, p: 1.0}
  - id: aug_008
    name: rotate_minus_10
    transform:
      class_name: Rotate
      params: {angle_range: [-10.0, -10.0], border_mode: 4, fill: 0, p: 1.0}
  - id: aug_009
    name: safe_rotate_plus_10
    transform:
      class_name: SafeRotate
      params: {angle_range: [10.0, 10.0], border_mode: 4, fill: 0, p: 1.0}
  - id: aug_010
    name: safe_rotate_minus_10
    transform:
      class_name: SafeRotate
      params: {angle_range: [-10.0, -10.0], border_mode: 4, fill: 0, p: 1.0}
  - id: aug_011
    name: translate_x_plus_5pct
    transform:
      class_name: Affine
      params: {translate_percent: {x: [0.05, 0.05], y: [0.0, 0.0]}, border_mode: 4, p: 1.0}
  - id: aug_012
    name: translate_x_minus_5pct
    transform:
      class_name: Affine
      params: {translate_percent: {x: [-0.05, -0.05], y: [0.0, 0.0]}, border_mode: 4, p: 1.0}
  - id: aug_013
    name: translate_y_plus_5pct
    transform:
      class_name: Affine
      params: {translate_percent: {x: [0.0, 0.0], y: [0.05, 0.05]}, border_mode: 4, p: 1.0}
  - id: aug_014
    name: translate_y_minus_5pct
    transform:
      class_name: Affine
      params: {translate_percent: {x: [0.0, 0.0], y: [-0.05, -0.05]}, border_mode: 4, p: 1.0}
  - id: aug_015
    name: scale_105
    transform: {class_name: Affine, params: {scale: [1.05, 1.05], border_mode: 4, p: 1.0}}
  - id: aug_016
    name: scale_095
    transform: {class_name: Affine, params: {scale: [0.95, 0.95], border_mode: 4, p: 1.0}}
  - id: aug_017
    name: shear_x_plus_5
    transform:
      class_name: Affine
      params: {shear: {x: [5.0, 5.0], y: [0.0, 0.0]}, border_mode: 4, p: 1.0}
  - id: aug_018
    name: shear_y_plus_5
    transform:
      class_name: Affine
      params: {shear: {x: [0.0, 0.0], y: [5.0, 5.0]}, border_mode: 4, p: 1.0}
  - id: aug_019
    name: brightness_plus_10
    transform: {class_name: RandomBrightnessContrast, params: {brightness_range: [0.1, 0.1], contrast_range: [0.0, 0.0], p: 1.0}}
  - id: aug_020
    name: brightness_minus_10
    transform: {class_name: RandomBrightnessContrast, params: {brightness_range: [-0.1, -0.1], contrast_range: [0.0, 0.0], p: 1.0}}
  - id: aug_021
    name: contrast_plus_10
    transform: {class_name: RandomBrightnessContrast, params: {brightness_range: [0.0, 0.0], contrast_range: [0.1, 0.1], p: 1.0}}
  - id: aug_022
    name: contrast_minus_10
    transform: {class_name: RandomBrightnessContrast, params: {brightness_range: [0.0, 0.0], contrast_range: [-0.1, -0.1], p: 1.0}}
