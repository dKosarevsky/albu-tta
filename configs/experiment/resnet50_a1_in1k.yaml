project_name: albu-tta
seed: 20260522

teacher:
  model_name: resnet50.a1_in1k
  pretrained: true
  data_config:
    input_size: [3, 224, 224]
    interpolation: bicubic
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    crop_pct: 0.95
    crop_mode: center

dataset:
  name: imagenet-val
  class_count: 1000
  class_index: timm-imagenet-1k
  images_per_class: 50
  public_per_class: 25
  private_per_class: 25
  public_train_per_class: 20
  public_val_per_class: 5

clean_baseline:
  split: public_val
  min_top1: 0.70
  min_top5: 0.90
  max_nll: 1.60

augmentations:
  registry_path: configs/augmentations/imagenet100.yaml
  candidate_count: 100
  identity_id: aug_000

selector:
  output_dim: 100
  max_parameters: 1500000
  usefulness_head: true
  usefulness_tau: 0.01
  usefulness_weight: 0.05
  top_k_grid:
    - 0
    - 1
    - 2
    - 4
    - 8
    - 16
  adaptive_threshold_grid:
    - 0.01
    - 0.03
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.5
    - 0.75
  adaptive_max_k_grid:
    - 0
    - 1
    - 2
    - 4
    - 8
    - 16

artifacts:
  root: artifacts
  manifests_dir: artifacts/manifests
  teacher_cache_dir: artifacts/teacher_cache
  selector_dir: artifacts/selector
  reports_dir: reports/resnet50_a1_in1k
